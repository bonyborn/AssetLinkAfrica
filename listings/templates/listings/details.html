{% extends 'base/base.html' %}

{% block content %}

<h2>{{ listing.title }}</h2>

<img src="{{ listing.image.url }}">

<p>{{ listing.description }}</p>

<p>{{ listing.location }}</p>

<p>KES {{ listing.price }}</p>

<form method="POST" action="{% url 'create_booking' listing.id %}">
    {% csrf_token %}
    <button>Book Now</button>
</form>

{% endblock %}
