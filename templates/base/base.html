{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        AssetLinkAfrica
        {% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/main.css' %}">

</head>

<body>

    {% include 'partials/navbar.html' %}

    <main>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="message {{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

</body>

</html>
