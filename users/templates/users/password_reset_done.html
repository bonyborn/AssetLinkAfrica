{% extends 'core/base.html' %}

{% block title %}Check Your Email | AssetLinkAfrica{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="container">
        <div class="auth-container">
            <div class="auth-form active">
                <span class="auth-eyebrow">Account recovery</span>
                <h2>Check your email</h2>
                <p>If an active account exists for that email address, a password reset link has been sent.</p>
                <div class="auth-footer">
                    <p><a href="{% url 'login' %}">Return to login</a></p>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
